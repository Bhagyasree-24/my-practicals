<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Navbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-blue-600 p-4">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    
    <!-- Logo -->
    <h1 class="text-white text-2xl font-bold">MySite</h1>

    <!-- Menu -->
    <ul class="flex space-x-6 text-white font-medium">
      <li><a href="#" class="hover:text-gray-200">Home</a></li>
      <li><a href="#" class="hover:text-gray-200">About</a></li>

      <!-- Dropdown -->
      <li class="relative group">
        <button class="hover:text-gray-200 focus:outline-none">
          Services ▼
        </button>

        <!-- Dropdown Menu -->
        <div class="absolute hidden group-hover:block bg-white text-black mt-2 w-40 rounded shadow-lg">
          <a href="#" class="block px-4 py-2 hover:bg-gray-200">Web Design</a>
          <a href="#" class="block px-4 py-2 hover:bg-gray-200">Development</a>
          <a href="#" class="block px-4 py-2 hover:bg-gray-200">SEO</a>
        </div>
      </li>

      <li><a href="#" class="hover:text-gray-200">Contact</a></li>
    </ul>

  </div>
</nav>

</body>
</html>
