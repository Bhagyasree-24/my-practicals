<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CyberGuard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f0a1f, #1a0f2e);
        }
        .register-card {
            background: rgba(30, 20, 55, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 bg-black/70 backdrop-blur-lg z-50 border-b border-violet-500/20">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-2xl flex items-center justify-center">
                    🛡️
                </div>
                <h1 class="text-2xl font-bold">CyberGuard</h1>
            </div>
            <a href="index.html" class="text-gray-400 hover:text-white flex items-center gap-1">
                ← Home
            </a>
        </div>
    </nav>

    <div class="w-full max-w-md mx-auto px-6">
        <div class="register-card rounded-3xl p-10 border border-violet-400/20">

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-2xl flex items-center justify-center text-4xl shadow-lg">
                    🛡️
                </div>
            </div>

            <!-- Heading -->
            <h2 class="text-3xl font-bold text-center mb-1">Create Account</h2>
            <p class="text-gray-400 text-center mb-8">Join CyberGuard and stay protected</p>

            <form class="space-y-6">
                
                <!-- Full Name -->
                <div>
                    <label class="block text-sm mb-2 text-gray-300">Full Name</label>
                    <input type="text" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-5 py-4 focus:border-violet-500 outline-none transition"
                           placeholder="John Doe" required>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm mb-2 text-gray-300">Email Address</label>
                    <input type="email" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-5 py-4 focus:border-violet-500 outline-none transition"
                           placeholder="you@example.com" required>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm mb-2 text-gray-300">Password</label>
                    <input type="password" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-5 py-4 focus:border-violet-500 outline-none transition"
                           placeholder="••••••••" required>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm mb-2 text-gray-300">Confirm Password</label>
                    <input type="password" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-5 py-4 focus:border-violet-500 outline-none transition"
                           placeholder="••••••••" required>
                </div>

                <!-- Sign Up Button -->
                <button type="submit"
                        class="w-full py-4 bg-gradient-to-r from-violet-500 to-fuchsia-500 rounded-2xl font-semibold text-lg hover:scale-105 transition shadow-lg">
                    Create My Account
                </button>
            </form>

            <!-- Divider -->
            <div class="my-8 flex items-center gap-3">
                <div class="flex-1 h-px bg-gray-700"></div>
                <span class="text-gray-500 text-sm">OR</span>
                <div class="flex-1 h-px bg-gray-700"></div>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-3 py-3 bg-gray-900 hover:bg-gray-800 rounded-2xl border border-gray-700 transition">
                    <i class="fab fa-google text-red-500"></i>
                    <span>Google</span>
                </button>
                <button class="flex items-center justify-center gap-3 py-3 bg-gray-900 hover:bg-gray-800 rounded-2xl border border-gray-700 transition">
                    <i class="fab fa-microsoft"></i>
                    <span>Microsoft</span>
                </button>
            </div>

            <!-- Login Link -->
            <p class="text-center mt-8 text-gray-400">
                Already have an account? 
                <a href="login.html" class="text-violet-400 hover:underline font-medium">Sign In</a>
            </p>

        </div>

        <!-- Security Note -->
        <p class="text-center text-xs text-gray-500 mt-8">
            🔒 Your information is safe and encrypted
        </p>
    </div>

</body>
</html>
