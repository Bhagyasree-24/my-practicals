<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
background: linear-gradient(135deg, #667eea, #764ba2);
height: 100vh;
}

.card {
border-radius: 15px;
background: white;
}

.btn-custom {
background: linear-gradient(to right, #ff6a00, #ee0979);
color: white;
border: none;
}

.btn-custom:hover {
opacity: 0.9;
}

h3 {
color: #764ba2;
font-weight: bold;
}

a {
color: #ee0979;
text-decoration: none;
}
</style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow-lg" style="width: 400px;">

<h3 class="text-center mb-3">Create Account</h3>

<form>
<input type="text" class="form-control mb-3" placeholder="Full Name" required>
<input type="email" class="form-control mb-3" placeholder="Email" required>
<input type="password" class="form-control mb-3" placeholder="Password" required>
<input type="password" class="form-control mb-3" placeholder="Confirm Password" required>

<button class="btn btn-custom w-100">Register</button>

<p class="text-center mt-3">
Already have an account? <a href="login.html">Sign In</a>
</p>
</form>

</div>
</div>

</body>
</html>
