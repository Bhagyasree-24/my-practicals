<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-lg">
  <h2 class="text-2xl font-bold mb-6 text-center">Student Registration</h2>

  <form id="studentForm" onsubmit="return validateForm()">

    <!-- Enrollment -->
    <input type="text" id="enroll" placeholder="Enrollment Number"
      class="w-full p-2 mb-3 border rounded">

    <!-- Name -->
    <input type="text" id="name" placeholder="Full Name"
      class="w-full p-2 mb-3 border rounded">

    <!-- Email -->
    <input type="text" id="email" placeholder="Email ID"
      class="w-full p-2 mb-3 border rounded">

    <!-- Password -->
    <input type="password" id="password" placeholder="Password"
      class="w-full p-2 mb-3 border rounded">

    <!-- Confirm Password -->
    <input type="password" id="confirmPassword" placeholder="Confirm Password"
      class="w-full p-2 mb-3 border rounded">

    <!-- Phone -->
    <input type="text" id="phone" placeholder="Phone Number"
      class="w-full p-2 mb-3 border rounded">

    <!-- Address -->
    <textarea id="address" placeholder="Address"
      class="w-full p-2 mb-3 border rounded"></textarea>

    <!-- Gender -->
    <div class="mb-3">
      <label class="font-semibold">Gender:</label><br>
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female" class="ml-4"> Female
    </div>

    <!-- Branch -->
    <select id="branch" class="w-full p-2 mb-4 border rounded">
      <option value="">Select Branch</option>
      <option>CSE</option>
      <option>IT</option>
      <option>Cyber Security</option>
      <option>Mechanical</option>
    </select>

    <!-- Submit -->
    <button type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
      Submit
    </button>

  </form>
</div>

<script>
function validateForm() {
  let enroll = document.getElementById("enroll").value.trim();
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let phone = document.getElementById("phone").value.trim();
  let address = document.getElementById("address").value.trim();
  let branch = document.getElementById("branch").value;
  let gender = document.querySelector('input[name="gender"]:checked');

  let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  let phonePattern = /^[0-9]{10}$/;

  // Enrollment
  if (enroll === "") {
    alert("Enrollment number is required");
    return false;
  }

  // Name
  if (name.length < 3) {
    alert("Name must be at least 3 characters");
    return false;
  }

  // Email
  if (!email.match(emailPattern)) {
    alert("Enter valid email");
    return false;
  }

  // Password
  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return false;
  }

  // Confirm Password
  if (password !== confirmPassword) {
    alert("Passwords do not match");
    return false;
  }

  // Phone
  if (!phone.match(phonePattern)) {
    alert("Enter valid 10-digit phone number");
    return false;
  }

  // Address
  if (address === "") {
    alert("Address is required");
    return false;
  }

  // Gender
  if (!gender) {
    alert("Select gender");
    return false;
  }

  // Branch
  if (branch === "") {
    alert("Select branch");
    return false;
  }

  alert("Form submitted successfully!");
  return true;
}
</script>

</body>
</html>
